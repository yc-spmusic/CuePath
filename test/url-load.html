<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CuePath core - loadUrl + peaks test</title>
  <link rel="stylesheet" href="../dist/cuepath-core.css">
  <style>
    body { font: 13px system-ui, sans-serif; margin: 12px; }
    #host { height: 560px; border: 1px solid #ccc; }
    #log { white-space: pre-wrap; margin-top: 12px; }
    .pass { color: #0a7a2f; } .fail { color: #b00020; font-weight: 700; }
  </style>
</head>
<body>
  <h3>CuePath core: loadUrl with peaks (serve over http, e.g. <code>npm test</code>)</h3>
  <div id="host"></div>
  <div id="log"></div>
<script type="module">
import { createCuePath } from "../dist/cuepath-core.mjs";

const results = [];
function check(name, ok, detail) {
  results.push({ name, ok: Boolean(ok), detail: detail === undefined ? "" : String(detail) });
  const el = document.createElement("div");
  el.className = ok ? "pass" : "fail";
  el.textContent = (ok ? "PASS " : "FAIL ") + name + (detail !== undefined ? "  [" + detail + "]" : "");
  document.getElementById("log").appendChild(el);
}
const wait = ms => new Promise(r => setTimeout(r, ms));
const nextFrames = async n => { for (let i = 0; i < n; i++) await new Promise(r => requestAnimationFrame(r)); };

/* ----- generated audio: 2.0 s, 440 Hz sine, 8 kHz mono 16-bit PCM WAV ----- */
const SR = 8000, DURATION = 2.0, N = SR * DURATION;
const samples = new Int16Array(N);
for (let i = 0; i < N; i++) samples[i] = Math.round(Math.sin(2 * Math.PI * 440 * i / SR) * 0.8 * 32767);
function wavBlob(pcm, sr) {
  const buf = new ArrayBuffer(44 + pcm.length * 2), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + pcm.length * 2, true); w(8, "WAVE"); w(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, "data"); v.setUint32(40, pcm.length * 2, true);
  new Int16Array(buf, 44).set(pcm);
  return new Blob([buf], { type: "audio/wav" });
}
const audioUrl = URL.createObjectURL(wavBlob(samples, SR));

/* peaks in the documented format (what the hub backend produces) */
const BUCKETS = 400, per = Math.floor(N / BUCKETS), pk = [];
for (let b = 0; b < BUCKETS; b++) {
  let mn = 0, mx = 0;
  for (let i = b * per; i < (b + 1) * per; i++) { const s = samples[i] / 32768; if (s < mn) mn = s; if (s > mx) mx = s; }
  pk.push(+mn.toFixed(4), +mx.toFixed(4));
}
const peaksJson = { version: 1, sampleRate: SR, samplesPerPixel: per, duration: DURATION, peaks: pk };
const peaksUrl = URL.createObjectURL(new Blob([JSON.stringify(peaksJson)], { type: "application/json" }));

/* instrumentation: decodeAudioData calls, AudioContext count, listener balance on document/window */
let decodeCalls = 0, contextsCreated = 0, contextsClosed = 0;
const AC = window.AudioContext || window.webkitAudioContext;
const origDecode = AC.prototype.decodeAudioData;
AC.prototype.decodeAudioData = function () { decodeCalls++; return origDecode.apply(this, arguments); };
const origClose = AC.prototype.close;
AC.prototype.close = function () { contextsClosed++; return origClose.apply(this, arguments); };
const ACproxy = new Proxy(AC, { construct(t, a) { contextsCreated++; return new t(...a); } });
window.AudioContext = ACproxy; window.webkitAudioContext = ACproxy;

let netListeners = 0;
const origAdd = EventTarget.prototype.addEventListener, origRem = EventTarget.prototype.removeEventListener;
EventTarget.prototype.addEventListener = function (t, f, o) {
  if (this === document || this === window) netListeners++;
  return origAdd.call(this, t, f, o);
};
EventTarget.prototype.removeEventListener = function (t, f, o) {
  if (this === document || this === window) netListeners--;
  return origRem.call(this, t, f, o);
};

function waveformPixels(root) {
  const c = root.querySelector("canvas.timeline-waveform");
  if (!c || !c.width) return 0;
  const d = c.getContext("2d").getImageData(0, 0, c.width, c.height).data;
  let n = 0; for (let i = 3; i < d.length; i += 4) if (d[i] > 0) n++;
  return n;
}

try {
  const host = document.getElementById("host");
  const STORAGE = "hub:test-audio-1";
  localStorage.removeItem(STORAGE);
  const baseline = netListeners;
  const cp = createCuePath(host, { storageKey: STORAGE, labels: { play: "PLAY-X" } });
  check("labels override applied", host.querySelector(".btn-play").textContent === "PLAY-X");
  check("root class applied", host.classList.contains("cuepath-root"));

  /* 1. streaming + inline peaks: no decode */
  const events = [];
  cp.on("ready", e => events.push(["ready", e.duration]));
  cp.on("peaks", e => events.push(["peaks", e.buckets]));
  await cp.loadUrl(audioUrl, { peaks: peaksJson, title: "sine.wav" });
  await nextFrames(3);
  const dur = cp.getAudioElement().duration;
  check("duration from <audio> is ~2.0s", Math.abs(dur - DURATION) < 0.05, dur);
  check("ready event fired", events.some(e => e[0] === "ready" && Math.abs(e[1] - DURATION) < 0.05));
  check("peaks event fired with 400 buckets", events.some(e => e[0] === "peaks" && e[1] === BUCKETS));
  check("audio src is the URL (streamed, not copied by core)", cp.getAudioElement().getAttribute("src") === audioUrl);
  check("waveform canvas drawn from peaks", waveformPixels(host) > 1000, waveformPixels(host));
  check("decodeAudioData NOT called when peaks given", decodeCalls === 0, decodeCalls);
  check("AudioContext NOT created when peaks given", contextsCreated === 0, contextsCreated);
  check("title used as media name", cp.getState().media.fileName === "sine.wav" && cp.getState().media.source === "url");

  /* 2. peaksUrl */
  await cp.loadUrl(audioUrl, { peaksUrl, title: "sine.wav" });
  await nextFrames(3);
  check("peaksUrl: waveform drawn", waveformPixels(host) > 1000, waveformPixels(host));
  check("peaksUrl: still no decode", decodeCalls === 0 && contextsCreated === 0);

  /* 3. invalid peaks rejected */
  let threw = false; try { cp.loadPeaks({ version: 1, peaks: [0, 1, 2] }); } catch (e) { threw = true; }
  check("loadPeaks rejects odd-length peaks", threw);
  threw = false; try { cp.loadPeaks({ version: 2, peaks: [0, 1] }); } catch (e) { threw = true; }
  check("loadPeaks rejects unknown version", threw);

  /* 4. state + storageKey persistence */
  const st = cp.getState();
  st.markers.push({ id: "m1", time: 0.5, label: "hello", note: "", tags: [], status: "todo" });
  st.regions.push({ id: "r1", start: 0.2, end: 1.0, label: "reg", note: "", tags: ["x"], status: "doing" });
  cp.setState(st);
  await nextFrames(2);
  check("setState: marker rendered on timeline", host.querySelectorAll(".timeline-marker").length === 1);
  check("setState: region rendered on timeline", host.querySelectorAll(".timeline-region").length === 1);
  const stored = JSON.parse(localStorage.getItem(STORAGE) || "null");
  check("state persisted under options.storageKey", stored && stored.markers.length === 1 && stored.regions.length === 1);
  check("default storage key untouched", localStorage.getItem("cuepath:html:mvp") === null);

  /* 5. controls: seek, rate, exports */
  const savedForClear = cp.getState();
  cp.seek(1.0);
  check("seek moves currentTime", Math.abs(cp.getAudioElement().currentTime - 1.0) < 0.05, cp.getAudioElement().currentTime);
  cp.setPlaybackRate(0.5);
  check("playback rate applied", cp.getAudioElement().playbackRate === 0.5);
  check("csv export contains marker", cp.toCsv().includes("hello"));
  check("markdown export contains region", cp.toMarkdown().includes("reg"));

  /* 5b. clearProject API (no confirm) + ui.headerActions */
  let confirmCalls = 0;
  const realConfirm = window.confirm;
  window.confirm = () => { confirmCalls++; return true; };
  let changeEvents = 0;
  const offChange = cp.on("change", () => { changeEvents++; });
  cp.clearProject();
  offChange();
  window.confirm = realConfirm;
  const cleared = cp.getState();
  check("clearProject clears markers/regions without confirm", cleared.markers.length === 0 && cleared.regions.length === 0 && confirmCalls === 0, confirmCalls);
  check("clearProject emits change", changeEvents >= 1, changeEvents);
  check("headerActions default: shown", !host.querySelector(".nav-actions").classList.contains("cp-hidden"));
  {
    const h2 = document.createElement("div"); document.body.appendChild(h2);
    const c2 = createCuePath(h2, { storageKey: STORAGE + ":ha", ui: { headerActions: false } });
    const na = h2.querySelector(".nav-actions");
    check("ui.headerActions:false hides buttons", getComputedStyle(na).display === "none" && getComputedStyle(h2.querySelector(".top-nav")).display !== "none");
    c2.destroy(); h2.remove();
  }
  cp.setState(savedForClear);

  /* 6. fallback decode (no peaks) */
  decodeCalls = 0;
  await cp.loadUrl(audioUrl, { title: "sine.wav" });
  for (let i = 0; i < 50 && !waveformPixels(host); i++) { await wait(100); await nextFrames(1); }
  check("fallback: decodeAudioData called when no peaks", decodeCalls === 1, decodeCalls);
  check("fallback: waveform drawn", waveformPixels(host) > 1000, waveformPixels(host));
  check("fallback: AudioContext closed", contextsClosed >= 1 && contextsClosed === contextsCreated, contextsCreated + "/" + contextsClosed);

  /* 7. destroy leaves nothing behind */
  const hold = cp.loadUrl(audioUrl, { peaksUrl, title: "again" }).catch(e => e.message);
  cp.destroy();
  const holdResult = await hold;
  check("pending loadUrl rejects on destroy", holdResult === "destroyed", holdResult);
  check("destroy: root emptied", host.childElementCount === 0 && !host.classList.contains("cuepath-root"));
  check("destroy: document/window listeners balanced", netListeners === baseline, "net " + (netListeners - baseline));
  await nextFrames(3);
  cp.destroy(); // idempotent
  check("destroy twice is a no-op", true);

  /* 8. remount works (React StrictMode style) */
  const cp2 = createCuePath(host, { storageKey: STORAGE });
  check("remount restores persisted state", cp2.getState().markers.length === 1);
  cp2.destroy();
  check("remount destroy balanced", netListeners === baseline, "net " + (netListeners - baseline));
} catch (e) {
  check("test harness threw", false, (e && e.stack) || e);
}

window.__results = results;
window.__done = true;
const failed = results.filter(r => !r.ok).length;
document.title = (failed ? "FAIL " : "PASS ") + results.length + " checks";
</script>
</body>
</html>
